name: Check and test Python package

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  linting:
    name: Linting
    runs-on: 'ubuntu-latest'
    strategy:
        matrix:
          python-version:
            - "3.11"
            - "3.12"
            - "3.13"
            - "3.14"
            - "3.15"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install poetry and dependencies
        uses: greenbone/actions/poetry@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check with black
        run: poetry run black --check --diff autohooks
      - name: Check with flake8
        run: poetry run flake8 autohooks

  type-checking:
    name: Type-checker
    strategy:
        matrix:
          python-version:
            - "3.11"
            - "3.12"
            - "3.13"
            - "3.14"
            - "3.15"
    uses: greenbone/workflows/.github/workflows/typing-python.yml@main
    with:
      python-version: ${{ matrix.python-version }}

  test:
    name: Run all tests
    strategy:
        matrix:
          python-version:
            - "3.11"
            - "3.12"
            - "3.13"
            - "3.14"
            - "3.15"
    uses: greenbone/workflows/.github/workflows/test-python.yml@main
    with:
      python-version: ${{ matrix.python-version }}

  codecov:
    name: Upload coverage to codecov.io
    needs: test
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Calculate and upload coverage to codecov.io
        uses: greenbone/actions/coverage-python@v3
        with:
          python-version: "3.11"
          token: ${{ secrets.CODECOV_TOKEN }}

  check-version:
    name: Check versioning for consistency
    uses: greenbone/workflows/.github/workflows/check-version.yml@main

  all-python-ci-jobs-passed:
    name: All Python CI jobs passed
    needs: [linting, type-checking, test, codecov, check-version]
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
